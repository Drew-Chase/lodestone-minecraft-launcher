[package]
name = "lodestone_export"
version = "0.2.2"
edition = "2024"
# Tests mirror src/ under tests/ and are wired in with #[path], so top-level files there are not
# separate test targets.
autotests = false

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = "9"
tar = "0.4"
xz2 = "0.1.7"
lodestone_fs = { path = "../fsutil" }
sha1 = "0.10"
sha2 = "0.10"
# sievemc_lib is not on crates.io, so it is pinned to a commit of Drew-Chase/sievemc (crate version 0.2.1).
sievemc_lib = { git = "https://github.com/Drew-Chase/sievemc", rev = "4b15baeb486b8a1773309cb4950df8e6fdd0c6dc" }
