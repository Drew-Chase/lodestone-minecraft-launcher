[package]
name = "lodestone_net"
version = "0.2.2"
edition = "2024"
# Tests mirror src/ under tests/ and are wired in with #[path], so top-level files there are not
# separate test targets.
autotests = false

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
sha1 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
