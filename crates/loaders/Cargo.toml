[package]
name = "lodestone_loaders"
version = "0.1.0"
edition = "2024"
# Tests mirror src/ under tests/ and are wired in with #[path], so only the
# integration binaries declared below are separate test targets.
autotests = false

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
piston-mc = { workspace = true }
simple_download_utility = { workspace = true }
modcrawl = { workspace = true }
zipcrawl = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zip = "9"

[[test]]
name = "mod_info"
path = "tests/integration/mod_info.rs"
