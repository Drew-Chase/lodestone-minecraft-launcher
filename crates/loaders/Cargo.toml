[package]
name = "lodestone_loaders"
version = "0.2.2"
edition = "2024"
# Tests mirror src/ under tests/ and are wired in with #[path], so only the
# integration binaries declared below are separate test targets.
autotests = false

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = "0.3"
sha1 = "0.10"
reqwest = { workspace = true }
lodestone_net = { path = "../net" }
lodestone_fs = { path = "../fsutil" }
tokio = { workspace = true, features = ["rt"] }
piston-mc = { workspace = true }
simple_download_utility = { workspace = true }
modcrawl = { workspace = true }
zipcrawl = { workspace = true }
toml = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zip = "9"
# The Java manifest types behind piston-mc's `java` feature, which the matrix test reads Mojang's runtimes with.
piston-mc = { workspace = true, features = ["java"] }

[[test]]
name = "mod_info"
path = "tests/integration/mod_info.rs"

[[test]]
name = "forge_install"
path = "tests/integration/forge_install/main.rs"
