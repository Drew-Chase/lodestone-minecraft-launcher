[package]
name = "lodestone_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
piston-mc = { version = "0.1.5-beta", features = ["assets", "downloads", "java"] }
aurora_leaf = {path="../aurora_leaf"}
lodestone_minecraft_authentication = { path = "../auth" }
open = "5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
dirs = "6"
lodestone_loaders = { path = "../loaders" }
lodestone_launch = { path = "../launcher" }
md-5 = "0.10"
zip = "9"
reqwest = { workspace = true }
simple_download_utility = { workspace = true }
fastrand = "2"
sipper = "0.1"
fastnbt = "2.6"
flate2 = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
iced = { version = "0.14", default-features = false, features = ["canvas", "advanced", "svg", "lazy", "sipper", "advanced-shaping", "web-colors", "crisp", "wgpu", "thread-pool", "tokio", "image", "x11", "wayland"] }
iced_borderless_window_resize_handle_widget = { version = "0.1" }
iced_color_extension = {version = "0.1.1"}
iced_anim = { version = "0.3.1", features = ["derive"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }


color-eyre = { version = "0.6.5", features = ["tracing-error", "track-caller"] }
chrono = { version = "0.4.45" }
tar = { version = "0.4.43" }
xz2 = { version = "0.1.7" }

[build-dependencies]
chrono = { version = "0.4.45" }
walkdir = { version = "2.5.0" }

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1.12" }