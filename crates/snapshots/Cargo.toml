[package]
name = "lodestone_snapshots"
version = "0.1.0"
edition = "2024"
# Tests mirror src/ under tests/ and are wired in with #[path], so top-level files there are not
# separate test targets.
autotests = false

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xz2 = "0.1.7"
zip = "9"
sha1 = "0.10"
chrono = { version = "0.4.45" }
