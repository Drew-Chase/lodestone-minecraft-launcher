# nginx server blocks for lodestonelauncher.com (the VPS). Install once:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/lodestonelauncher.conf
#   sudo ln -s /etc/nginx/sites-available/lodestonelauncher.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before reloading, check the three values marked below:
#   - root: the folder the FTP login starts in (the deploy uploads there)
#   - ssl_certificate / ssl_certificate_key: the certificate the server already uses
#   - the PHP-FPM socket: `ls -l /tmp/php-cgi-82.sock` (the TAVERN template's name for it)
# Disable any other site that still answers for these names, such as the stock "default" site.

server {
    listen 80;
    listen [::]:80;
    server_name lodestonelauncher.com www.lodestonelauncher.com;

    return 301 https://lodestonelauncher.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lodestonelauncher.com www.lodestonelauncher.com;

    ssl_certificate     /etc/letsencrypt/live/lodestonelauncher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodestonelauncher.com/privkey.pem;

    root /var/www/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve dotfiles. The deploy keeps .ftp-deploy-sync-state.json in the web root.
    # /.well-known/ stays reachable for certificate renewal.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Composer packages and PHP files outside the API are source code, not pages.
    location ^~ /vendor/ {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }

    # The API. The ^~ prefix matches keep these ahead of the .php rule above.
    location = /api {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Build output is content-hashed, so it can be cached for a year.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The single-page site: real files first, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
