# nginx server blocks for lodestonelauncher.com (the aaPanel VPS). Install once:
#
#   1. In aaPanel, disable any other site that answers for these names (the default site,
#      or the site this file replaces), so only one server block claims them.
#   2. Copy this file over aaPanel's vhost for the domain:
#        sudo cp deploy/nginx.conf /www/server/panel/vhost/nginx/lodestonelauncher.com.conf
#   3. Test and reload with aaPanel's nginx:
#        sudo /www/server/nginx/sbin/nginx -t && sudo /www/server/nginx/sbin/nginx -s reload
#
# aaPanel rewrites this vhost when the site is edited in the panel, so make changes here
# and copy the file again, rather than editing it in the panel.
#
# Before reloading, check the three values marked below:
#   - root: aaPanel's site folder (the FTP login starts there, and the deploy uploads there)
#   - ssl_certificate / ssl_certificate_key: aaPanel's certificate for the domain
#   - the PHP-FPM socket: `ls -l /tmp/php-cgi-82.sock` (aaPanel's PHP 8.2 socket)

server {
    listen 80;
    listen [::]:80;
    server_name lodestonelauncher.com www.lodestonelauncher.com;

    return 301 https://lodestonelauncher.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lodestonelauncher.com www.lodestonelauncher.com;

    ssl_certificate     /www/server/panel/vhost/cert/lodestonelauncher.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/lodestonelauncher.com/privkey.pem;

    # TLS 1.0 and 1.1 are deprecated (RFC 8996), so the aaPanel list's TLSv1.1 is dropped.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /www/wwwroot/lodestonelauncher.com;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve dotfiles. The deploy keeps .ftp-deploy-sync-state.json in the web root.
    # /.well-known/ stays reachable for certificate renewal.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Composer packages and PHP files outside the API are source code, not pages.
    location ^~ /vendor/ {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }

    # The API. The ^~ prefix matches keep these ahead of the .php rule above.
    location = /api {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Build output is content-hashed, so it can be cached for a year.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images outside /assets/ (favicons, the logo, the OG image) change rarely, so cache them for 30 days.
    location ~* \.(gif|jpe?g|png|bmp|ico|webp|svg)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # The single-page site: real files first, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
