name: Website

on:
  push:
    branches: [master]
    paths: ['website/**', 'res/installer.sh', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'res/installer.sh', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A queued run waits for the running one instead of cancelling it.
concurrency:
  group: website-deploy
  cancel-in-progress: false

env:
  FTP_SERVER: 198.74.56.197
  FTP_SERVER_DIR: ./

jobs:
  test:
    name: Test the website API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lodestone_test
          MYSQL_USER: lodestone
          MYSQL_PASSWORD: lodestone
        ports:
          # Same host port and user as the local Docker database, so phpunit.xml.dist needs no CI-specific values.
          - 13006:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, json, openssl, mbstring
          tools: composer:v2

      - name: Install PHP dependencies with dev packages
        working-directory: website
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the PHPUnit tests
        # phpunit.xml.dist forces the database and the other test settings, so the runner's environment does not matter.
        working-directory: website
        run: php vendor/bin/phpunit

  build:
    name: Build and deploy the website
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2

      - name: Install PHP dependencies
        working-directory: website
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Write the production config
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: website
        env:
          APP_URL: https://lodestonelauncher.com
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_SOLO_MONTHLY: ${{ secrets.STRIPE_PRICE_SOLO_MONTHLY }}
          STRIPE_PRICE_SOLO_YEARLY: ${{ secrets.STRIPE_PRICE_SOLO_YEARLY }}
          STRIPE_PRICE_FRIENDS_MONTHLY: ${{ secrets.STRIPE_PRICE_FRIENDS_MONTHLY }}
          STRIPE_PRICE_FRIENDS_YEARLY: ${{ secrets.STRIPE_PRICE_FRIENDS_YEARLY }}
          STRIPE_PRICE_UNLIMITED_MONTHLY: ${{ secrets.STRIPE_PRICE_UNLIMITED_MONTHLY }}
          STRIPE_PRICE_UNLIMITED_YEARLY: ${{ secrets.STRIPE_PRICE_UNLIMITED_YEARLY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: php scripts/write-production-config.php

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build the site
        working-directory: website
        run: pnpm run build

      - name: Assemble the deploy folder
        working-directory: website
        run: |
          cp -R api vendor dist/
          rm -rf dist/api/.env dist/api/var
          test -f dist/index.html
          test -f dist/api/index.php
          test -f dist/vendor/autoload.php
          test -f dist/install
          test ! -e dist/.env
          test ! -e dist/api/.env
          test ! -e dist/api/var
          # Same condition as the production config step. Pull requests and other branches have no such file.
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            test -f dist/api/config/production.php
          fi

      - name: Scan the build for secrets
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: website
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: php scripts/check-dist-secrets.php dist

      - name: Deploy over FTP
        # Pull requests and branches only build. Only master (on push or a manual run) deploys.
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.WEBSITE_FTP_USERNAME }}
          password: ${{ secrets.WEBSITE_FTP_PASSWORD }}
          protocol: ftp
          local-dir: website/dist/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 120000
          log-level: standard
