name: CI

# Formatting, lints and tests for every push and pull request. The release workflow builds the shipped files; this one
# checks the code that they are built from, on the three desktop systems.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustup show` installs the toolchain that rust-toolchain.toml names, with its rustfmt and clippy.
      - name: Install the toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
