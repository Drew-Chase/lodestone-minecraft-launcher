<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lodestone Thumbnail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: 1280x720 YouTube thumbnail. Headline left, real app screens stacked right, bleeding off the edge. */
:root {
  color-scheme: dark;
  --ink: #08090a;
  --green: #22ff84;
  --violet: #8b5cf6;
  --text: #f4f7f5;
  --display: "Inter Tight", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--ink); color: var(--text) }
.stage { position: absolute; inset: 0; overflow: hidden; perspective: 1600px;
  background:
    radial-gradient(ellipse 55% 70% at 18% 40%, rgba(34,255,132,.22), transparent 70%),
    radial-gradient(ellipse 50% 60% at 95% 95%, rgba(139,92,246,.30), transparent 70%),
    var(--ink) }
.grid { position: absolute; inset: 0; background-image:
  linear-gradient(rgba(34,255,132,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(34,255,132,.06) 1px, transparent 1px);
  background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse 80% 80% at 40% 50%, #000 20%, transparent 90%) }
.shot { position: absolute; width: 900px; border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 2px rgba(255,255,255,.10), 0 40px 90px rgba(0,0,0,.75), 0 0 80px rgba(34,255,132,.18) }
.shot img { display: block; width: 100% }
.back { left: 720px; top: 40px; transform: rotateY(-24deg) rotateX(6deg) rotateZ(2deg); opacity: .75; filter: saturate(1.1) }
.front { left: 690px; top: 250px; transform: rotateY(-22deg) rotateX(8deg) rotateZ(-2deg) }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--ink) 0%, rgba(8,9,10,.92) 38%, rgba(8,9,10,0) 58%) }
.copy { position: absolute; left: 64px; top: 70px; width: 640px }
.brand { display: flex; align-items: center; gap: 16px; font: 900 44px/1 var(--display); letter-spacing: -.03em }
.brand svg { width: 64px; height: 64px; filter: drop-shadow(0 0 18px rgba(34,255,132,.7)) }
h1 { font: 900 94px/.92 var(--display); white-space: nowrap; letter-spacing: -.045em; margin-top: 44px; text-shadow: 0 6px 30px rgba(0,0,0,.6) }
h1 em { font-style: normal; color: var(--green); text-shadow: 0 0 40px rgba(34,255,132,.55) }
.logos { display: flex; gap: 12px; margin-top: 40px }
.logos span { width: 66px; height: 66px; border-radius: 16px; display: grid; place-items: center; background: #eef3f0; box-shadow: 0 8px 24px rgba(0,0,0,.45) }
.logos img { width: 40px; height: 40px }
.tag { position: absolute; left: 64px; bottom: 54px; font: 700 26px/1 var(--mono); letter-spacing: .14em; color: var(--ink); background: var(--green); padding: 12px 18px; border-radius: 10px; box-shadow: 0 0 40px rgba(34,255,132,.5) }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="shot back"><img src="frames/m_discover.jpg" alt=""></div>
  <div class="shot front"><img src="frames/library.jpg" alt=""></div>
  <div class="fade"></div>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 32 32" fill="none"><path d="M6 2 H26 L30 6 V26 L26 30 H6 L2 26 V6 Z" stroke="#22ff84" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="16" r="8.5" stroke="#22ff84" stroke-width="1.4" stroke-opacity=".45"/><path d="M16 16 L22.5 9.5 L20 16 Z" fill="#22ff84"/><path d="M16 16 L9.5 22.5 L12 16 Z" fill="#22ff84" fill-opacity=".35"/><circle cx="16" cy="16" r="1.6" fill="#08090a" stroke="#22ff84"/></svg>Lodestone</div>
    <h1>Every mod.<br><em>One launcher.</em></h1>
    <div class="logos"><span><img src="plat/modrinth.svg" alt=""></span><span><img src="plat/curseforge.svg" alt=""></span><span><img src="plat/atlauncher.svg" alt=""></span><span><img src="plat/technic.png" alt=""></span><span><img src="plat/ftb.svg" alt=""></span></div>
  </div>
  <div class="tag">FREE · OPEN SOURCE</div>
</div>
</body>
</html>
