[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
tracing = { version = "0.1", features = ["max_level_trace"] }
thiserror = { version = "2.0.21" }
reqwest = { version = "0.13.5", features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = { version = "1.0.154" }
base64 = "0.22"
anyhow = { version = "1.0.100" }
ferinth = { version = "2.13.1" }
oauth2 = { version = "5.0.0", default-features = false }
minecraft-msa-auth = { version = "0.5" }
http = { version = "1", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
piston-mc = { version = "0.1.5-beta", default-features = false, features = ["downloads"] }
simple_download_utility = { version = "0.1.1" }
modcrawl = { version = "0.7.0", default-features = false }
zipcrawl = { version = "2.5.0", default-features = false }

[profile.release]
lto = true
codegen-units = 16
# Unwinding, so a panic in background work is a failed task and not the end of the launcher. The panic hook keeps a report of it.
panic = "unwind"
# Speed, not size: hashing, archive extraction and image decoding are CPU-bound and run on the launch path.
opt-level = 3
strip = true

# aurora_leaf is generated code: six whole Iconify sets, one `&'static str` getter per icon and a `by_name` match with one arm
# per icon (about 15,000 in material-symbols alone). Optimising it took LLVM ten minutes, nearly the whole release build,
# and buys nothing: a getter returns a constant, and `by_name` is unused (LTO drops it). Debug builds already compile it
# unoptimised, as a workspace crate. The rest of the release build keeps fat LTO and one codegen unit.
[profile.release.package.aurora_leaf]
opt-level = 0

[profile.profiling.package.aurora_leaf]
opt-level = 0

# Dependencies (iced, wgpu, resvg, image, cosmic-text) run optimised in debug builds too, so
# `cargo run` is usable. Workspace crates keep the default debug settings.
[profile.dev.package."*"]
opt-level = 3

# Release optimisation and LTO with symbols, for sampling profilers (`just profile`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
