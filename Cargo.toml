[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
tracing = { version = "0.1", features = ["max_level_trace"] }
thiserror = { version = "2.0.21" }
reqwest = { version = "0.13.5", features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = { version = "1.0.154" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
